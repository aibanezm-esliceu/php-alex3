services:
  web:
    build: .
    container_name: php-web-viajes
    ports:
      - "81100:80"
    volumes:
      - ../proyecto-php-viajes:/var/www/html
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb:11
    container_name: mariadb-viajes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agencia_php
      MYSQL_USER: guia
      MYSQL_PASSWORD: viaje123
    volumes:
      - ../db-viajes:/var/lib/mysql
    ports:
      - "3320:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-viajes
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: guia
      PMA_PASSWORD: viaje123
    ports:
      - "8111:80"
  browsersync:
    image: node:20-alpine
    container_name: browsersync-viajes
    working_dir: /app
    depends_on:
      - web
    volumes:
      - ../proyecto-php-viajes:/src
    command: sh -c "npm install -g browser-sync && browser-sync start --proxy 'web:80' --files '/src/**/*.*' --no-ui --host 0.0.0.0 --port 3002"
    ports:
      - "3002:3002"
